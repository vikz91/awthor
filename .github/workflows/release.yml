name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    name: Verify and publish
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Validate release version
        shell: bash
        run: |
          if [[ ! "$GITHUB_REF_NAME" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "Release tags must use stable semantic versioning, for example v0.1.1."
            exit 1
          fi

          package_version="$(node -p "require('./package.json').version")"
          if [[ "v$package_version" != "$GITHUB_REF_NAME" ]]; then
            echo "Tag $GITHUB_REF_NAME does not match package.json version $package_version."
            exit 1
          fi

          git fetch --no-tags origin main
          if ! git merge-base --is-ancestor HEAD origin/main; then
            echo "Release tags must point to a commit already present on main."
            exit 1
          fi
      - run: bun install --frozen-lockfile
      - run: bun run lint
      - run: bun test
      - run: node node_modules/next/dist/bin/next build
      - run: git diff --check
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --title "Awthor $GITHUB_REF_NAME" \
            --notes "Live application: https://awthor.abhishekdeb.com" \
            --generate-notes \
            --verify-tag \
            --fail-on-no-commits \
            --latest
