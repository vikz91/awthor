version: 2

# Dependabot's Bun updater does not yet parse the bun.lock format generated by Bun 1.4.
# Dependency alerts and security updates remain enabled in the repository settings.
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:30"
      timezone: "Asia/Kolkata"
    open-pull-requests-limit: 3
    commit-message:
      prefix: "chore(deps)"
    groups:
      github-actions:
        patterns:
          - "*"
